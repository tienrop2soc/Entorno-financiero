<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Entorno Financiero</title>
  <meta name="description" content="Control personal de gastos, ingresos, nómina, presupuestos, ahorro, deudas e inversiones.">
  <meta name="theme-color" content="#efeff1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
    <span class="ring-deco r1"></span><span class="ring-deco r2"></span>
  </div>

  <div class="app">
    <aside class="sidebar glass" aria-label="Navegación principal">
      <a class="brand" href="#/resumen">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-t">Entorno<br><b>Financiero</b></span>
      </a>
      <button class="btn btn-primary wide side-add" data-action="add" data-type="expense">
        <svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Añadir movimiento
      </button>
      <nav id="sideNav"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="viewTitle">Resumen</h1>
        <div class="topbar-actions">
          <button class="icon-btn glass-pill" data-action="toggleTheme" aria-label="Cambiar entre blanco y negro" title="Blanco / negro">
            <svg class="i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
          </button>
          <button class="btn btn-primary top-add" data-action="add" data-type="expense">
            <svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Añadir</span>
          </button>
        </div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <nav class="tabbar glass" id="tabbar" aria-label="Navegación"></nav>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toasts" aria-live="polite"></div>

  <noscript><p style="padding:24px">Esta aplicación necesita JavaScript.</p></noscript>

  <script src="js/icons.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/views-main.js"></script>
  <script src="js/views-plan.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
