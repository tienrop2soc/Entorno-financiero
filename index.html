<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Entorno Financiero</title>
  <meta name="description" content="Tus cuentas, tu efectivo y tus inversiones en un solo lugar.">
  <meta name="theme-color" content="#efeff1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
    <span class="ring-deco r1"></span><span class="ring-deco r2"></span>
  </div>

  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Entorno <b>Financiero</b></span></div>
    <button class="icon-btn glass-pill" data-act="settings" aria-label="Ajustes">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
    </button>
  </header>

  <main id="view" class="wrap"></main>

  <nav class="tabbar glass" id="tabbar" aria-label="Páginas"></nav>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toasts" aria-live="polite"></div>

  <noscript><p style="padding:24px">Esta aplicación necesita JavaScript.</p></noscript>
  <script src="js/app.js"></script>
</body>
</html>
